# Serve the SEO Statistic app at https://parsercompressor.online/stat
#
# Add these two location blocks INSIDE your existing `server { ... }` block
# for parsercompressor.online (the one that already serves your parser site).
# They are more specific than `location /`, so only /stat* is routed here —
# your existing site is untouched.
#
# Requires ROOT_PATH=/stat in /opt/seostat/.env (the app then serves /stat/*).

location = /stat { return 308 /stat/; }

location /stat/ {
    proxy_pass http://127.0.0.1:8011;          # no trailing slash: keeps the /stat/ prefix
    client_max_body_size 1024M;                # large visit archives (.tsv/.gz/.zip); overrides the server cap
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;                   # backfill/collect can take a while
}
