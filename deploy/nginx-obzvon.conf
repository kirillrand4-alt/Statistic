# Обзвон для продажников на https://parsercompressor.online/obzvon
#
# Добавьте эти два location-блока ВНУТРЬ существующего `server { ... }`
# для parsercompressor.online (рядом с блоками /stat из nginx-subpath.conf).
#
# Пароли задаются НЕ в nginx, а в /opt/seostat/.env (OBZVON_USERS) — само
# приложение спрашивает Basic auth. Основной сервис /stat этим процессом
# не обслуживается: у обзвона свой процесс (порт 8012) без роутов статистики.

location = /obzvon { return 308 /obzvon/; }

location /obzvon/ {
    proxy_pass http://127.0.0.1:8012;          # без завершающего слэша: префикс /obzvon/ сохраняется
    client_max_body_size 64M;                  # выгрузки компаний (.xlsx)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
