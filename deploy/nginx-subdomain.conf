# Alternative to a subpath: serve the app on its own subdomain
# https://stat.parsercompressor.online  (simplest, zero risk to the main site).
#
# 1) Add a DNS A-record:  stat.parsercompressor.online -> 161.104.48.72
# 2) Save as /etc/nginx/sites-available/seostat and symlink into sites-enabled.
# 3) Leave ROOT_PATH empty in .env (the app runs at root on this subdomain).
# 4) After it answers on :80, get TLS:  sudo certbot --nginx -d stat.parsercompressor.online

server {
    listen 80;
    server_name stat.parsercompressor.online;

    client_max_body_size 1024M;            # allow large visit archives (.tsv/.gz/.zip); default is 1M -> 413

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
