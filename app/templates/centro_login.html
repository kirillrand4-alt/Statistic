<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Вход — Центробежные</title><link rel="stylesheet" href="{{ base_path }}/static/css/centro.css"></head>
<body class="centro-login"><form method="post" class="login-box"><h1>Центробежные</h1><p>Вход в рабочую базу</p>{% if error %}<div class="alert">Неверный логин или пароль</div>{% endif %}<label>Логин<input name="username" autocomplete="username" required autofocus></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><button>Войти</button></form></body></html>
