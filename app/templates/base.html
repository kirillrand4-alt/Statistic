<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <script>/* применяем выбранный скин до отрисовки, чтобы не мигало */
    try { if (localStorage.getItem('skin') === 'green') document.documentElement.setAttribute('data-skin', 'green'); } catch (e) {}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SEO Статистика{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ base_path }}/static/vendor/pico.min.css">
  <link rel="stylesheet" href="{{ base_path }}/static/css/app.css">
  <script src="{{ base_path }}/static/vendor/chart.umd.min.js"></script>
  <script>
    if (window.Chart) {  /* tint charts to match the ivory & gold theme */
      Chart.defaults.color = '#3a2f1c';
      Chart.defaults.borderColor = 'rgba(184,144,47,.18)';
      Chart.defaults.font.family = "system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif";
    }
  </script>
</head>
<body>
  <main class="container">
    {% include "partials/nav.html" %}
    {% block content %}{% endblock %}
    <footer><small>SEO Статистика · источники: Google Search Console, Яндекс.Вебмастер, Яндекс.Метрика</small></footer>
  </main>
  {% block scripts %}{% endblock %}
  <script>/* переключатель темы: золото <-> нежно салатовый (сохраняется в браузере) */
    (function () {
      var root = document.documentElement, btn = document.getElementById('skin-toggle');
      function label() { if (btn) btn.textContent = root.getAttribute('data-skin') === 'green' ? '👑' : '🌿'; }
      label();
      if (btn) btn.addEventListener('click', function (e) {
        e.preventDefault();
        var green = root.getAttribute('data-skin') === 'green';
        if (green) root.removeAttribute('data-skin'); else root.setAttribute('data-skin', 'green');
        try { localStorage.setItem('skin', green ? 'ivory' : 'green'); } catch (_) {}
        label();
      });
    })();
  </script>
  <script src="{{ base_path }}/static/js/sort.js"></script>
  <script src="{{ base_path }}/static/js/site-search.js"></script>
</body>
</html>
